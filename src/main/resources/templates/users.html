<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пользователи</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem auto;
            max-width: 960px;
            background: #ffffff;
            color: #1f2933;
        }
        h1, h2 {
            margin-bottom: 0.5rem;
        }
        form.add-form, table {
            width: 100%;
        }
        form.add-form {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        input, button {
            font: inherit;
            padding: 0.4rem 0.6rem;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            background: #ffffff;
            color: #1f2933;
        }
        table {
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #d0d7de;
            padding: 0.5rem;
            vertical-align: middle;
        }
        th {
            text-align: left;
            background: #f6f8fa;
        }
        .actions {
            display: flex;
            gap: 0.4rem;
            white-space: nowrap;
        }
        .empty {
            color: #6b7280;
        }
    </style>
</head>
<body>
<h1>Пользователи</h1>

<h2>Добавить</h2>
<form class="add-form" th:action="@{/add}" method="post">
    <input type="text" name="firstName" placeholder="Имя" required>
    <input type="text" name="lastName" placeholder="Фамилия" required>
    <input type="text" name="email" placeholder="Email" required>
    <button type="submit">Добавить</button>
</form>

<h2>Список</h2>
<p class="empty" th:if="${#lists.isEmpty(users)}">Пользователей пока нет.</p>
<table th:if="${!#lists.isEmpty(users)}">
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Фамилия</th>
        <th>Email</th>
        <th>Действия</th>
    </tr>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td>
            <input type="text" name="firstName" th:value="${user.firstName}" required
                   th:attr="form=${'edit-' + user.id}">
        </td>
        <td>
            <input type="text" name="lastName" th:value="${user.lastName}" required
                   th:attr="form=${'edit-' + user.id}">
        </td>
        <td>
            <input type="text" name="email" th:value="${user.email}" required
                   th:attr="form=${'edit-' + user.id}">
        </td>
        <td>
            <div class="actions">
                <form method="post" th:action="@{/update}" th:id="'edit-' + ${user.id}">
                    <input type="hidden" name="id" th:value="${user.id}">
                    <button type="submit">Изменить</button>
                </form>
                <form method="post" th:action="@{/delete}">
                    <input type="hidden" name="id" th:value="${user.id}">
                    <button type="submit">Удалить</button>
                </form>
            </div>
        </td>
    </tr>
</table>
</body>
</html>
